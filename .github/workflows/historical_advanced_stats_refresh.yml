name: Build Historical Statcast Archive

on:
  workflow_dispatch:

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install DuckDB CLI
        run: |
          wget https://github.com/duckdb/duckdb/releases/download/v1.0.0/duckdb_cli-linux-amd64.zip
          unzip duckdb_cli-linux-amd64.zip
          sudo mv duckdb /usr/local/bin/

      - name: Fetch and Export Baseball-Reference Parquet
        run: |
          mkdir -p static/data
          mkdir -p tmp

          fetch_csv() {
            local url="$1"
            local dest="$2"
            local fallback_header="$3"

            curl -sL -A "Mozilla/5.0" "$url" -o "$dest"
            
            if [ ! -s "$dest" ] || grep -q -i "<html" "$dest"; then
              echo "$fallback_header" > "$dest"
            fi
          }

          fetch_csv "https://www.baseball-reference.com/data/war_daily_bat.txt" "tmp/war_daily_bat.txt" "mlb_ID,player_ID,name_common,year_ID,team_ID,stint_ID,lg_ID,age,PA,G,OPS_plus,WAR,runs_bat,runs_br,runs_defense"
          fetch_csv "https://www.baseball-reference.com/data/war_daily_pitch.txt" "tmp/war_daily_pitch.txt" "mlb_ID,player_ID,name_common,year_ID,team_ID,stint_ID,lg_ID,age,G,GS,IPouts,WAR,era_plus"

          duckdb -c "
            CREATE TABLE raw_bat AS 
            SELECT 
              CAST(mlb_ID AS VARCHAR) AS mlb_id,
              CAST(player_ID AS VARCHAR) AS player_ID,
              CAST(name_common AS VARCHAR) AS name_common,
              CAST(year_ID AS INTEGER) AS year_ID,
              CAST(team_ID AS VARCHAR) AS team_ID,
              CAST(stint_ID AS INTEGER) AS stint_ID,
              CAST(lg_ID AS VARCHAR) AS lg_ID,
              CAST(age AS INTEGER) AS age,
              CAST(PA AS INTEGER) AS PA,
              CAST(G AS INTEGER) AS G_bat,
              CAST(OPS_plus AS DOUBLE) AS ops_plus,
              CAST(WAR AS DOUBLE) AS WAR_bat,
              CAST(runs_bat AS DOUBLE) AS runs_bat,
              CAST(runs_br AS DOUBLE) AS runs_br,
              CAST(runs_defense AS DOUBLE) AS runs_defense
            FROM read_csv('tmp/war_daily_bat.txt', header=True, ignore_errors=True, nullstr=['NULL', ''], union_by_name=True);

            CREATE TABLE raw_pitch AS 
            SELECT 
              CAST(mlb_ID AS VARCHAR) AS mlb_id,
              CAST(player_ID AS VARCHAR) AS player_ID,
              CAST(name_common AS VARCHAR) AS name_common,
              CAST(year_ID AS INTEGER) AS year_ID,
              CAST(team_ID AS VARCHAR) AS team_ID,
              CAST(stint_ID AS INTEGER) AS stint_ID,
              CAST(lg_ID AS VARCHAR) AS lg_ID,
              CAST(age AS INTEGER) AS age,
              CAST(G AS INTEGER) AS G_pitch,
              CAST(GS AS INTEGER) AS GS,
              CAST(IPouts AS DOUBLE) AS IPouts,
              CAST(WAR AS DOUBLE) AS WAR_pitch,
              CAST(era_plus AS DOUBLE) AS era_plus
            FROM read_csv('tmp/war_daily_pitch.txt', header=True, ignore_errors=True, nullstr=['NULL', ''], union_by_name=True);

            CREATE TABLE bref_combined AS 
            SELECT 
              COALESCE(b.mlb_id, p.mlb_id) AS mlb_id, 
              COALESCE(b.player_ID, p.player_ID) AS player_ID, 
              COALESCE(b.name_common, p.name_common) AS name_common, 
              COALESCE(b.year_ID, p.year_ID) AS year_ID, 
              COALESCE(b.team_ID, p.team_ID) AS team_ID, 
              COALESCE(b.stint_ID, p.stint_ID) AS stint_ID, 
              COALESCE(b.lg_ID, p.lg_ID) AS lg_ID, 
              COALESCE(b.age, p.age) AS age, 
              ROUND(COALESCE(b.WAR_bat, 0) + COALESCE(p.WAR_pitch, 0), 2) AS WAR_total, 
              COALESCE(b.WAR_bat, 0) AS WAR_bat, 
              COALESCE(p.WAR_pitch, 0) AS WAR_pitch, 
              b.PA, 
              b.G_bat, 
              b.ops_plus, 
              b.runs_bat, 
              b.runs_br, 
              b.runs_defense, 
              p.G_pitch, 
              p.GS, 
              ROUND(COALESCE(p.IPouts, 0) / 3.0, 1) AS IP, 
              p.era_plus 
            FROM raw_bat b 
            FULL OUTER JOIN raw_pitch p 
              ON b.player_ID = p.player_ID 
             AND b.year_ID = p.year_ID 
             AND b.stint_ID = p.stint_ID;

            COPY (SELECT * FROM bref_combined ORDER BY player_ID, year_ID DESC) TO 'static/data/bref_daily.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);
          "
          rm -rf tmp/*.txt

      - name: Build Statcast Parquet Archive (2015 to 2025)
        run: |
          mkdir -p tmp

          fetch_csv() {
            local url="$1"
            local dest="$2"
            local fallback_header="$3"

            curl -sL -A "Mozilla/5.0" "$url" -o "$dest"
            
            if [ ! -s "$dest" ] || grep -q -i "<html" "$dest"; then
              echo "$fallback_header" > "$dest"
            fi
          }

          for YEAR in {2015..2025}; do
            echo "Processing Statcast data for year $YEAR..."
            
            fetch_csv "https://baseballsavant.mlb.com/leaderboard/percentile-rankings?type=batter&year=${YEAR}&csv=true" "tmp/bat_pct.csv" "player_id,exit_velocity,hard_hit_percent,brl_percent,brl,xwoba,xba,xslg,whiff_percent,k_percent,bb_percent,chase_percent,sprint_speed"
            fetch_csv "https://baseballsavant.mlb.com/leaderboard/expected_statistics?type=batter&year=${YEAR}&min=1&csv=true" "tmp/bat_xstats.csv" "player_id,ba,est_ba,slg,est_slg,woba,est_woba"
            fetch_csv "https://baseballsavant.mlb.com/statcast_leaderboard?type=batter&year=${YEAR}&min=1&csv=true" "tmp/bat_ev.csv" "player_id,avg_hit_speed,max_hit_speed,ev50,brl_percent,hard_hit_percent"
            fetch_csv "https://baseballsavant.mlb.com/leaderboard/custom?year=${YEAR}&type=batter&filter=&min=1&selections=whiff_percent,chase_percent,swing_percent,sweet_spot_percent&chart=false&csv=true" "tmp/bat_custom.csv" "player_id,whiff_percent,chase_percent,swing_percent,sweet_spot_percent"
            fetch_csv "https://baseballsavant.mlb.com/leaderboard/swing-take?year=${YEAR}&team=&leverage=Neutral&group=Batter&type=All&sub_type=null&min=1&csv=True" "tmp/bat_rv.csv" "player_id,n_runs_all"
            fetch_csv "https://baseballsavant.mlb.com/leaderboard/swing-take?year=${YEAR}&team=&leverage=Neutral&group=Pitcher&type=All&sub_type=null&min=1&csv=True" "tmp/pitch_rv.csv" "player_id,n_runs_all"
            fetch_csv "https://baseballsavant.mlb.com/leaderboard/fielding-run-value?gameType=Regular&seasonStart=${YEAR}&seasonEnd=${YEAR}&type=fielder&position=&minInnings=1&csv=true" "tmp/field_rv.csv" "pos_player_id,fielding_run_value,oaa"
            fetch_csv "https://baseballsavant.mlb.com/leaderboard/baserunning-run-value?gameType=Regular&season_start=${YEAR}&season_end=${YEAR}&type=Runners&minOpportunities=1&csv=true" "tmp/base_rv.csv" "runner_id,run_value"

            duckdb -c "
              CREATE TABLE savant_bat_pct AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(exit_velocity AS INTEGER) AS pct_exit_velocity, CAST(hard_hit_percent AS INTEGER) AS pct_hard_hit, CAST(COALESCE(TRY_CAST(brl_percent AS INTEGER), TRY_CAST(brl AS INTEGER)) AS INTEGER) AS pct_barrel, CAST(xwoba AS INTEGER) AS pct_xwoba, CAST(xba AS INTEGER) AS pct_xba, CAST(xslg AS INTEGER) AS pct_xslg, CAST(whiff_percent AS INTEGER) AS pct_whiff, CAST(k_percent AS INTEGER) AS pct_k_rate, CAST(bb_percent AS INTEGER) AS pct_bb_rate, CAST(chase_percent AS INTEGER) AS pct_chase, CAST(sprint_speed AS INTEGER) AS pct_sprint_speed FROM read_csv('tmp/bat_pct.csv', header=True, ignore_errors=True, nullstr=['NULL', ''], union_by_name=True) WHERE player_id IS NOT NULL AND CAST(player_id AS VARCHAR) != '';

              CREATE TABLE savant_bat_xstats AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(ba AS DOUBLE) AS ba, CAST(est_ba AS DOUBLE) AS xba, CAST(slg AS DOUBLE) AS slg, CAST(est_slg AS DOUBLE) AS xslg, CAST(woba AS DOUBLE) AS woba, CAST(est_woba AS DOUBLE) AS xwoba FROM read_csv('tmp/bat_xstats.csv', header=True, ignore_errors=True, nullstr=['NULL', ''], union_by_name=True) WHERE player_id IS NOT NULL AND CAST(player_id AS VARCHAR) != '';

              CREATE TABLE savant_bat_ev AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(avg_hit_speed AS DOUBLE) AS avg_exit_velocity, CAST(max_hit_speed AS DOUBLE) AS max_exit_velocity, CAST(ev50 AS DOUBLE) AS ev50, CAST(brl_percent AS DOUBLE) AS barrel_rate, CAST(hard_hit_percent AS DOUBLE) AS hard_hit_rate FROM read_csv('tmp/bat_ev.csv', header=True, ignore_errors=True, nullstr=['NULL', ''], union_by_name=True) WHERE player_id IS NOT NULL AND CAST(player_id AS VARCHAR) != '';

              CREATE TABLE savant_bat_custom AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(whiff_percent AS DOUBLE) AS whiff_rate, CAST(chase_percent AS DOUBLE) AS chase_rate, CAST(swing_percent AS DOUBLE) AS swing_rate, CAST(sweet_spot_percent AS DOUBLE) AS sweet_spot_rate FROM read_csv('tmp/bat_custom.csv', header=True, ignore_errors=True, nullstr=['NULL', ''], union_by_name=True) WHERE player_id IS NOT NULL AND CAST(player_id AS VARCHAR) != '';

              CREATE TABLE savant_bat_rv AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(n_runs_all AS DOUBLE) AS savant_bat_run_val FROM read_csv('tmp/bat_rv.csv', header=True, ignore_errors=True, nullstr=['NULL', ''], union_by_name=True) WHERE player_id IS NOT NULL AND CAST(player_id AS VARCHAR) != '';

              CREATE TABLE savant_pitch_rv AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(n_runs_all AS DOUBLE) AS savant_pitch_run_val FROM read_csv('tmp/pitch_rv.csv', header=True, ignore_errors=True, nullstr=['NULL', ''], union_by_name=True) WHERE player_id IS NOT NULL AND CAST(player_id AS VARCHAR) != '';

              CREATE TABLE savant_field_rv AS SELECT CAST(pos_player_id AS VARCHAR) AS mlb_id, CAST(fielding_run_value AS DOUBLE) AS savant_field_run_val, CAST(oaa AS INTEGER) AS oaa FROM read_csv('tmp/field_rv.csv', header=True, ignore_errors=True, nullstr=['NULL', ''], union_by_name=True) WHERE pos_player_id IS NOT NULL AND CAST(pos_player_id AS VARCHAR) != '';

              CREATE TABLE savant_base_rv AS SELECT CAST(runner_id AS VARCHAR) AS mlb_id, CAST(run_value AS DOUBLE) AS savant_base_run_val FROM read_csv('tmp/base_rv.csv', header=True, ignore_errors=True, nullstr=['NULL', ''], union_by_name=True) WHERE runner_id IS NOT NULL AND CAST(runner_id AS VARCHAR) != '';

              CREATE TABLE savant_keys AS 
              SELECT DISTINCT mlb_id FROM (
                SELECT mlb_id FROM savant_bat_pct UNION
                SELECT mlb_id FROM savant_bat_xstats UNION
                SELECT mlb_id FROM savant_bat_ev UNION
                SELECT mlb_id FROM savant_bat_custom UNION
                SELECT mlb_id FROM savant_bat_rv UNION
                SELECT mlb_id FROM savant_pitch_rv UNION
                SELECT mlb_id FROM savant_field_rv UNION
                SELECT mlb_id FROM savant_base_rv
              );

              CREATE TABLE savant_${YEAR} AS 
              SELECT 
                ${YEAR} AS year_ID, 
                k.mlb_id, 
                bp.pct_exit_velocity, bp.pct_hard_hit, bp.pct_barrel, bp.pct_xwoba, bp.pct_xba, bp.pct_xslg, bp.pct_whiff, bp.pct_k_rate, bp.pct_bb_rate, bp.pct_chase, bp.pct_sprint_speed, 
                bx.xba, bx.xslg, bx.woba, bx.xwoba, 
                bev.avg_exit_velocity, bev.max_exit_velocity, bev.ev50, bev.barrel_rate, bev.hard_hit_rate, 
                bc.whiff_rate, bc.chase_rate, bc.swing_rate, bc.sweet_spot_rate, 
                sb.savant_bat_run_val, 
                sp.savant_pitch_run_val, 
                sf.savant_field_run_val, sf.oaa, 
                sr.savant_base_run_val 
              FROM savant_keys k
              LEFT JOIN savant_bat_pct bp USING (mlb_id)
              LEFT JOIN savant_bat_xstats bx USING (mlb_id)
              LEFT JOIN savant_bat_ev bev USING (mlb_id)
              LEFT JOIN savant_bat_custom bc USING (mlb_id)
              LEFT JOIN savant_bat_rv sb USING (mlb_id)
              LEFT JOIN savant_pitch_rv sp USING (mlb_id)
              LEFT JOIN savant_field_rv sf USING (mlb_id)
              LEFT JOIN savant_base_rv sr USING (mlb_id);

              COPY savant_${YEAR} TO 'static/data/savant_${YEAR}.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);
            "
            rm -rf tmp/*.csv
            sleep 1
          done
          rm -rf tmp

      - name: Commit Archive Parquet Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: generate historical bref and savant parquet archives (2015-2025)" && git push)
