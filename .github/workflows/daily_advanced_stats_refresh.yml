name: Daily Baseball Data Pipeline

on:
  schedule:
    # Runs every morning at 10:14am EST (14:14 UTC)
    - cron: '14 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseball-data-pipeline
  cancel-in-progress: false

jobs:
  build-current-season:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          wget -q --tries 3 https://github.com/duckdb/duckdb/releases/download/v1.0.0/duckdb_cli-linux-amd64.zip
          unzip -o duckdb_cli-linux-amd64.zip
          sudo mv duckdb /usr/local/bin/
          duckdb --version

      - name: Fetch B-Ref & Current Season Statcast Data
        run: |
          set -euo pipefail
          mkdir -p static/data
          mkdir -p tmp
          source .github/scripts/fetch_csv.sh

          YEAR=$(date +%Y)

          # war_daily files contain every season, so the full bref index can be
          # rebuilt from scratch on every run.
          fetch_csv "https://www.baseball-reference.com/data/war_daily_bat.txt" "tmp/war_daily_bat.txt" "mlb_ID,player_ID,name_common,year_ID,team_ID,stint_ID,lg_ID,age,PA,G,OPS_plus,WAR,runs_bat,runs_br,runs_defense"
          fetch_csv "https://www.baseball-reference.com/data/war_daily_pitch.txt" "tmp/war_daily_pitch.txt" "mlb_ID,player_ID,name_common,year_ID,team_ID,stint_ID,lg_ID,age,G,GS,IPouts,WAR,era_plus"

          fetch_csv "https://baseballsavant.mlb.com/leaderboard/percentile-rankings?type=batter&year=${YEAR}&csv=true" "tmp/bat_pct.csv" "player_id,exit_velocity,hard_hit_percent,brl_percent,brl,xwoba,xba,xslg,whiff_percent,k_percent,bb_percent,chase_percent,sprint_speed"
          fetch_csv "https://baseballsavant.mlb.com/leaderboard/expected_statistics?type=batter&year=${YEAR}&min=1&csv=true" "tmp/bat_xstats.csv" "player_id,ba,est_ba,slg,est_slg,woba,est_woba"
          fetch_csv "https://baseballsavant.mlb.com/statcast_leaderboard?type=batter&year=${YEAR}&min=1&csv=true" "tmp/bat_ev.csv" "player_id,avg_hit_speed,max_hit_speed,ev50,brl_percent,ev95percent"
          fetch_csv "https://baseballsavant.mlb.com/leaderboard/custom?year=${YEAR}&type=batter&filter=&min=1&selections=whiff_percent,chase_percent,swing_percent,sweet_spot_percent&chart=false&csv=true" "tmp/bat_custom.csv" "player_id,whiff_percent,chase_percent,swing_percent,sweet_spot_percent"
          fetch_csv "https://baseballsavant.mlb.com/leaderboard/swing-take?year=${YEAR}&team=&leverage=Neutral&group=Batter&type=All&sub_type=null&min=1&csv=True" "tmp/bat_rv.csv" "player_id,runs_all"
          fetch_csv "https://baseballsavant.mlb.com/leaderboard/swing-take?year=${YEAR}&team=&leverage=Neutral&group=Pitcher&type=All&sub_type=null&min=1&csv=True" "tmp/pitch_rv.csv" "player_id,runs_all"
          fetch_csv "https://baseballsavant.mlb.com/leaderboard/percentile-rankings?type=pitcher&year=${YEAR}&csv=true" "tmp/pitch_pct.csv" "player_id,xwoba,xba,xslg,brl_percent,exit_velocity,hard_hit_percent,k_percent,bb_percent,whiff_percent,chase_percent,arm_strength,xera,fb_velocity,fb_spin,curve_spin"
          fetch_csv "https://baseballsavant.mlb.com/leaderboard/expected_statistics?type=pitcher&year=${YEAR}&min=1&csv=true" "tmp/pitch_xstats.csv" "player_id,woba,est_woba,est_ba,est_slg,xera"
          fetch_csv "https://baseballsavant.mlb.com/statcast_leaderboard?type=pitcher&year=${YEAR}&min=1&csv=true" "tmp/pitch_ev.csv" "player_id,avg_hit_speed,max_hit_speed,ev50,brl_percent,ev95percent,avg_hit_angle,anglesweetspotpercent,avg_distance"
          fetch_csv "https://baseballsavant.mlb.com/leaderboard/fielding-run-value?gameType=Regular&seasonStart=${YEAR}&seasonEnd=${YEAR}&type=fielder&position=&minInnings=1&csv=true" "tmp/field_rv.csv" "id,total_runs,inf_of_runs,range_runs,arm_runs,dp_runs,catching_runs,framing_runs,throwing_runs,blocking_runs"
          fetch_csv "https://baseballsavant.mlb.com/leaderboard/arm-strength?year=${YEAR}&minThrows=1&pos=arm_of&team=&type=player&csv=true" "tmp/arm_str.csv" "player_id,arm_overall,max_arm_strength"
          fetch_csv "https://baseballsavant.mlb.com/leaderboard/baserunning-run-value?gameType=Regular&season_start=${YEAR}&season_end=${YEAR}&type=Runners&minOpportunities=1&csv=true" "tmp/base_rv.csv" "player_id,runner_runs_tot"

      - name: Build Browser Data Files
        run: |
          set -euo pipefail
          bash .github/scripts/build_bref_index.sh
          bash .github/scripts/build_savant_json.sh "$(date +%Y)"

          rm -rf tmp

      - name: Commit Updated JSON Data Files
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          YEAR=$(date +%Y)
          git add static/data/bref_index.json static/data/savant_${YEAR}.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily update bref index and ${YEAR} savant data" && git push)
