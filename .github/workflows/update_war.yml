name: Daily Baseball-Reference Data Sync

on:
  schedule:
    # Pulls every morning at 10:14am EST (2:14pm / 14:14 UTC)
    - cron: '14 14 * * *'
  workflow_dispatch:

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v6

      - name: Initialize Runtime Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Resolve Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pybaseball

      - name: Build Local JSON Datastores
        run: python scripts/update_war.py

      - name: Publish Changes Directly to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # CHANGED: Use a wildcard to capture all generated JSON data stores
          git add static/data/*.json

          if git diff --staged --quiet; then
            echo "No historical metric updates recorded."
          else
            git commit -m "Automated Daily Data Sync: Updated advanced statistical tables"
            git push
          fi
