name: Daily Baseball Data Pipeline

on:
  schedule:
    # Runs every morning at 10:14am EST (14:14 UTC)
    - cron: '14 14 * * *'
  workflow_dispatch:

jobs:
  build-current-season:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install DuckDB CLI
        run: |
          wget https://github.com/duckdb/duckdb/releases/download/v1.0.0/duckdb_cli-linux-amd64.zip
          unzip duckdb_cli-linux-amd64.zip
          sudo mv duckdb /usr/local/bin/

      - name: Fetch and Update B-Ref & Current Season Statcast (2026)
        run: |
          mkdir -p static/data

          duckdb -c "
            -- 1. B-Ref Daily (Using header=True, explicit column casting, and nullstr handling)
            CREATE TABLE raw_bat AS 
            SELECT 
              CAST(mlb_ID AS VARCHAR) AS mlb_id,
              CAST(player_ID AS VARCHAR) AS player_ID,
              CAST(name_common AS VARCHAR) AS name_common,
              CAST(year_ID AS INTEGER) AS year_ID,
              CAST(team_ID AS VARCHAR) AS team_ID,
              CAST(stint_ID AS INTEGER) AS stint_ID,
              CAST(lg_ID AS VARCHAR) AS lg_ID,
              CAST(age AS INTEGER) AS age,
              CAST(PA AS INTEGER) AS PA,
              CAST(G AS INTEGER) AS G_bat,
              CAST(OPS_plus AS DOUBLE) AS ops_plus,
              CAST(WAR AS DOUBLE) AS WAR_bat,
              CAST(runs_bat AS DOUBLE) AS runs_bat,
              CAST(runs_br AS DOUBLE) AS runs_br,
              CAST(runs_defense AS DOUBLE) AS runs_defense
            FROM read_csv('https://www.baseball-reference.com/data/war_daily_bat.txt', header=True, ignore_errors=True, nullstr=['NULL', '']);

            CREATE TABLE raw_pitch AS 
            SELECT 
              CAST(mlb_ID AS VARCHAR) AS mlb_id,
              CAST(player_ID AS VARCHAR) AS player_ID,
              CAST(name_common AS VARCHAR) AS name_common,
              CAST(year_ID AS INTEGER) AS year_ID,
              CAST(team_ID AS VARCHAR) AS team_ID,
              CAST(stint_ID AS INTEGER) AS stint_ID,
              CAST(lg_ID AS VARCHAR) AS lg_ID,
              CAST(age AS INTEGER) AS age,
              CAST(G AS INTEGER) AS G_pitch,
              CAST(GS AS INTEGER) AS GS,
              CAST(IPouts AS DOUBLE) AS IPouts,
              CAST(WAR AS DOUBLE) AS WAR_pitch,
              CAST(era_plus AS DOUBLE) AS era_plus
            FROM read_csv('https://www.baseball-reference.com/data/war_daily_pitch.txt', header=True, ignore_errors=True, nullstr=['NULL', '']);

            CREATE TABLE bref_combined AS 
            SELECT 
              COALESCE(b.mlb_id, p.mlb_id) AS mlb_id, 
              COALESCE(b.player_ID, p.player_ID) AS player_ID, 
              COALESCE(b.name_common, p.name_common) AS name_common, 
              COALESCE(b.year_ID, p.year_ID) AS year_ID, 
              COALESCE(b.team_ID, p.team_ID) AS team_ID, 
              COALESCE(b.stint_ID, p.stint_ID) AS stint_ID, 
              COALESCE(b.lg_ID, p.lg_ID) AS lg_ID, 
              COALESCE(b.age, p.age) AS age, 
              ROUND(COALESCE(b.WAR_bat, 0) + COALESCE(p.WAR_pitch, 0), 2) AS WAR_total, 
              COALESCE(b.WAR_bat, 0) AS WAR_bat, 
              COALESCE(p.WAR_pitch, 0) AS WAR_pitch, 
              b.PA, 
              b.G_bat, 
              b.ops_plus, 
              b.runs_bat, 
              b.runs_br, 
              b.runs_defense, 
              p.G_pitch, 
              p.GS, 
              ROUND(COALESCE(p.IPouts, 0) / 3.0, 1) AS IP, 
              p.era_plus 
            FROM raw_bat b 
            FULL OUTER JOIN raw_pitch p 
              ON b.player_ID = p.player_ID 
             AND b.year_ID = p.year_ID 
             AND b.stint_ID = p.stint_ID;

            COPY (SELECT * FROM bref_combined ORDER BY player_ID, year_ID DESC) TO 'static/data/bref_daily.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);

            -- 2. 2026 Statcast
            CREATE TABLE savant_bat_pct AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(percentile_exit_velocity AS INTEGER) AS pct_exit_velocity, CAST(percentile_hard_hit AS INTEGER) AS pct_hard_hit, CAST(percentile_barrel AS INTEGER) AS pct_barrel, CAST(percentile_xwoba AS INTEGER) AS pct_xwoba, CAST(percentile_xba AS INTEGER) AS pct_xba, CAST(percentile_xslg AS INTEGER) AS pct_xslg, CAST(percentile_whiff_percent AS INTEGER) AS pct_whiff, CAST(percentile_k_percent AS INTEGER) AS pct_k_rate, CAST(percentile_bb_percent AS INTEGER) AS pct_bb_rate, CAST(percentile_chase_percent AS INTEGER) AS pct_chase, CAST(percentile_sprint_speed AS INTEGER) AS pct_sprint_speed FROM read_csv('https://baseballsavant.mlb.com/leaderboard/percentile-rankings?type=batter&year=2026&csv=true', header=True, ignore_errors=True, nullstr=['NULL', '']);

            CREATE TABLE savant_bat_xstats AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(ba AS DOUBLE) AS ba, CAST(est_ba AS DOUBLE) AS xba, CAST(slg AS DOUBLE) AS slg, CAST(est_slg AS DOUBLE) AS xslg, CAST(woba AS DOUBLE) AS woba, CAST(est_woba AS DOUBLE) AS xwoba FROM read_csv('https://baseballsavant.mlb.com/leaderboard/expected_statistics?type=batter&year=2026&min=1&csv=true', header=True, ignore_errors=True, nullstr=['NULL', '']);

            CREATE TABLE savant_bat_ev AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(avg_hit_speed AS DOUBLE) AS avg_exit_velocity, CAST(max_hit_speed AS DOUBLE) AS max_exit_velocity, CAST(ev50 AS DOUBLE) AS ev50, CAST(brl_percent AS DOUBLE) AS barrel_rate, CAST(hard_hit_percent AS DOUBLE) AS hard_hit_rate FROM read_csv('https://baseballsavant.mlb.com/statcast_leaderboard?type=batter&year=2026&min=1&csv=true', header=True, ignore_errors=True, nullstr=['NULL', '']);

            CREATE TABLE savant_bat_custom AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(whiff_percent AS DOUBLE) AS whiff_rate, CAST(chase_percent AS DOUBLE) AS chase_rate, CAST(swing_percent AS DOUBLE) AS swing_rate, CAST(sweet_spot_percent AS DOUBLE) AS sweet_spot_rate FROM read_csv('https://baseballsavant.mlb.com/leaderboard/custom?year=2026&type=batter&filter=&min=1&selections=whiff_percent,chase_percent,swing_percent,sweet_spot_percent&chart=false&csv=true', header=True, ignore_errors=True, nullstr=['NULL', '']);

            CREATE TABLE savant_bat_rv AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(n_runs_all AS DOUBLE) AS savant_bat_run_val FROM read_csv('https://baseballsavant.mlb.com/leaderboard/swing-take?year=2026&team=&leverage=Neutral&group=Batter&type=All&sub_type=null&min=1&csv=True', header=True, ignore_errors=True, nullstr=['NULL', '']);

            CREATE TABLE savant_pitch_rv AS SELECT CAST(player_id AS VARCHAR) AS mlb_id, CAST(n_runs_all AS DOUBLE) AS savant_pitch_run_val FROM read_csv('https://baseballsavant.mlb.com/leaderboard/swing-take?year=2026&team=&leverage=Neutral&group=Pitcher&type=All&sub_type=null&min=1&csv=True', header=True, ignore_errors=True, nullstr=['NULL', '']);

            CREATE TABLE savant_field_rv AS SELECT CAST(pos_player_id AS VARCHAR) AS mlb_id, CAST(fielding_run_value AS DOUBLE) AS savant_field_run_val, CAST(oaa AS INTEGER) AS oaa FROM read_csv('https://baseballsavant.mlb.com/leaderboard/fielding-run-value?gameType=Regular&seasonStart=2026&seasonEnd=2026&type=fielder&position=&minInnings=1&csv=true', header=True, ignore_errors=True, nullstr=['NULL', '']);

            CREATE TABLE savant_base_rv AS SELECT CAST(runner_id AS VARCHAR) AS mlb_id, CAST(run_value AS DOUBLE) AS savant_base_run_val FROM read_csv('https://baseballsavant.mlb.com/leaderboard/baserunning-run-value?gameType=Regular&season_start=2026&season_end=2026&type=Runners&minOpportunities=1&csv=true', header=True, ignore_errors=True, nullstr=['NULL', '']);

            CREATE TABLE savant_2026 AS SELECT 2026 AS year_ID, COALESCE(bp.mlb_id, bx.mlb_id, bev.mlb_id, bc.mlb_id, sb.mlb_id, sp.mlb_id, sf.mlb_id, sr.mlb_id) AS mlb_id, bp.pct_exit_velocity, bp.pct_hard_hit, bp.pct_barrel, bp.pct_xwoba, bp.pct_xba, bp.pct_xslg, bp.pct_whiff, bp.pct_k_rate, bp.pct_bb_rate, bp.pct_chase, bp.pct_sprint_speed, bx.xba, bx.xslg, bx.woba, bx.xwoba, bev.avg_exit_velocity, bev.max_exit_velocity, bev.ev50, bev.barrel_rate, bev.hard_hit_rate, bc.whiff_rate, bc.chase_rate, bc.swing_rate, bc.sweet_spot_rate, sb.savant_bat_run_val, sp.savant_pitch_run_val, sf.savant_field_run_val, sf.oaa, sr.savant_base_run_val FROM savant_bat_pct bp FULL OUTER JOIN savant_bat_xstats bx ON bp.mlb_id = bx.mlb_id FULL OUTER JOIN savant_bat_ev bev ON COALESCE(bp.mlb_id, bx.mlb_id) = bev.mlb_id FULL OUTER JOIN savant_bat_custom bc ON COALESCE(bp.mlb_id, bx.mlb_id, bev.mlb_id) = bc.mlb_id FULL OUTER JOIN savant_bat_rv sb ON COALESCE(bp.mlb_id, bx.mlb_id, bev.mlb_id, bc.mlb_id) = sb.mlb_id FULL OUTER JOIN savant_pitch_rv sp ON COALESCE(bp.mlb_id, bx.mlb_id, bev.mlb_id, bc.mlb_id, sb.mlb_id) = sp.mlb_id FULL OUTER JOIN savant_field_rv sf ON COALESCE(bp.mlb_id, bx.mlb_id, bev.mlb_id, bc.mlb_id, sb.mlb_id, sp.mlb_id) = sf.mlb_id FULL OUTER JOIN savant_base_rv sr ON COALESCE(bp.mlb_id, bx.mlb_id, bev.mlb_id, bc.mlb_id, sb.mlb_id, sp.mlb_id, sf.mlb_id) = sr.mlb_id;

            COPY savant_2026 TO 'static/data/savant_2026.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);
          "

      - name: Commit Updated Current Parquet Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/bref_daily.parquet static/data/savant_2026.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily update bref and 2026 savant parquet files" && git push)
